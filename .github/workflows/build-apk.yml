# Builds an APK on demand and whenever a release is published.
#
# Triggers:
#   - Manually: Actions tab -> "Build APK" -> Run workflow (pick debug or release).
#   - Automatically: when a GitHub release is published.
#
# What you get:
#   - Every run uploads the APK as a workflow artifact (Actions tab -> run -> Artifacts).
#   - Release runs also attach the APK to the release itself.
#   - Manual runs create a new GitHub release (tagged
#     apk-<build type>-<run number>) and attach the APK to it.
#
# Build type:
#   - Debug is the default and needs no secrets. The workflow generates the
#     debug keystore this repo's build expects (app/build.gradle.kts points
#     the debug signing config at ${rootDir}/debug.keystore, which is
#     gitignored and never committed).
#   - Release builds need the upload keystore as repo secrets:
#       KEYSTORE_BASE64     base64 of my-upload-key.jks
#       KEYSTORE_PASSWORD   keystore password (STORE_PASSWORD)
#       KEY_PASSWORD        key password for alias "upload"
#     A release run builds the release APK when KEYSTORE_BASE64 is set, and
#     falls back to debug (with a warning) when it is not.
name: Build APK

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: "Build type"
        type: choice
        options:
          - debug
          - release
        default: debug
  release:
    types: [published]

permissions:
  contents: write # attach the APK to the release

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: "21"
          distribution: temurin

      - name: Install Android 36.1 platform and build tools
        uses: android-actions/setup-android@v3
        with:
          packages: platforms;android-36.1 build-tools;36.0.0

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Determine build type
        id: build-type
        env:
          HAS_KEYSTORE: ${{ secrets.KEYSTORE_BASE64 != '' }}
        run: |
          TYPE="debug"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TYPE="${{ inputs.build_type }}"
          elif [ "$HAS_KEYSTORE" = "true" ]; then
            TYPE="release"
          fi
          if [ "$TYPE" = "release" ] && [ "$HAS_KEYSTORE" != "true" ]; then
            echo "::warning::Release keystore secret (KEYSTORE_BASE64) is not set — building debug instead."
            TYPE="debug"
          fi
          echo "type=$TYPE" >> "$GITHUB_OUTPUT"
          echo "Building a $TYPE APK."

      - name: Create debug keystore
        run: >
          keytool -genkeypair -keystore debug.keystore
          -storepass android -alias androiddebugkey -keypass android
          -keyalg RSA -keysize 2048 -validity 10000
          -dname "CN=Android Debug,O=Android,C=US"

      - name: Restore release keystore
        if: steps.build-type.outputs.type == 'release'
        run: printf '%s' "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > my-upload-key.jks

      - name: Build APK
        env:
          STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          TYPE="${{ steps.build-type.outputs.type }}"
          ./gradlew ":app:assemble${TYPE^}" --stacktrace

      - name: Rename APK
        run: |
          TYPE="${{ steps.build-type.outputs.type }}"
          cp "app/build/outputs/apk/$TYPE/app-$TYPE.apk" "LyricVault-${{ github.ref_name }}-$TYPE.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: LyricVault-${{ github.ref_name }}-${{ steps.build-type.outputs.type }}-apk
          path: LyricVault-${{ github.ref_name }}-${{ steps.build-type.outputs.type }}.apk
          if-no-files-found: error

      - name: Attach APK to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: LyricVault-${{ github.ref_name }}-${{ steps.build-type.outputs.type }}.apk

      - name: Create release and upload APK (manual runs)
        if: github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ steps.build-type.outputs.type }}-${{ github.run_number }}
          name: LyricVault ${{ steps.build-type.outputs.type }} APK — manual build ${{ github.run_number }}
          body: |
            APK built by a manual "Build APK" workflow run (#${{ github.run_number }}) from branch ${{ github.ref_name }}.
          prerelease: ${{ steps.build-type.outputs.type == 'debug' }}
          files: LyricVault-${{ github.ref_name }}-${{ steps.build-type.outputs.type }}.apk
          
